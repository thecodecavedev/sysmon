<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tauri App</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <main class="container">
    <div class="top-bar">
      <div class="connection-pill">
        <div class="dot"></div>
        <p id="valu"></p>
      </div>
      <div class="refresh">
        refresh
      </div>
    </div>
    <div class="main">
      <p class="ram"></p>
    </div>
    <div class="progress-bar">
      <progress id="ram-prog" max="100" value="40">70%</progress>
    </div>
    <p class="cpu"></p>
    


  </main>
</body>

</html>
